[package]
name = "rustlaya"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
candle-core = { version = "0.11.0", features = ["metal"] }
candle-nn = { version = "0.11.0", features = ["metal"] }
hf-hub = { version = "1", features = ["blocking"] }
indexmap = { version = "2", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tokenizers = "0.23.2"

[dev-dependencies]
crossterm = "0.29.0"
reqwest = { version = "0.13.5", features = ["json"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync"] }
